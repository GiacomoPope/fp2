[package]
keywords = ["finite", "field", "isogeny", "isogenies"]
name = "fp2"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
categories = ["cryptography"]
authors = ["Giacomo Pope <giacomopope@gmail.com>"]
description = "An efficient, flexible and constant time Rust implementation of the extension field Fp^2 with modulus x^2 + 1"
repository = "https://github.com/GiacomoPope/fp2/"

[features]
default = ["test-utils"]
test-utils = []

# Four-way field arithmetic. Requires Rust 1.89.
simd = ["dep:fearless_simd"]

# Exercises the packed arithmetic with a forced scalar backend in tests.
test-simd-fallback = ["simd", "fearless_simd/force_support_fallback"]

[dependencies]
rand_core = "0.9"

# SIMD backend
fearless_simd = { version = "1.1", optional = true }

[dev-dependencies]
criterion = { version = "0.5" }
sha2 = "0.10.2"
num-bigint = "0.4.3"

[[bench]]
name = "benchmark_fp2"
path = "benches/fp2_bench.rs"
harness = false
