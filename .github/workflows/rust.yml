name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ stable, "1.85" ]
        os: [ ubuntu-latest ]
        include:
          - toolchain: stable
            os: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install toolchain
      run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal && rustup default ${{ matrix.toolchain }}
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose --features test-utils

  simd:
    name: SIMD (${{ matrix.toolchain }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: stable
            os: ubuntu-latest
            backend: avx2
          - toolchain: "1.89"
            os: ubuntu-latest
            backend: avx2
          - toolchain: stable
            os: macos-14
            backend: neon
    env:
      FP2_EXPECT_SIMD_BACKEND: ${{ matrix.backend }}
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.toolchain }}
    - run: cargo check --lib --no-default-features --features simd
    - run: cargo test --release --features simd
    - run: cargo test --release --features test-simd-fallback --lib

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install toolchain
      run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
    - name: Check formatting
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: Build benchmarks
      run: cargo bench --no-run
