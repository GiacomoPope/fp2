name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.toolchain }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ stable, "1.85" ]
        os: [ ubuntu-latest ]
        include:
          - toolchain: stable
            os: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install toolchain
      run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal && rustup default ${{ matrix.toolchain }}
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose --features test-utils

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install toolchain
      run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
    - name: Check formatting
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Build benchmarks
      run: cargo bench --no-run
